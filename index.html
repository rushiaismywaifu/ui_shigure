<!DOCTYPE html>
<html lang="zh-TW" prefix="og: http://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="時雨羽衣 (9歲) - 羽衣馬麻的專屬頁面">

  <meta property="og:title" content="時雨羽衣">
  <meta property="og:description" content="(9歲)">
  <meta property="og:url" content="https://rushiaismywaifu.github.io/ui_shigure">
  <meta property="og:image" content="https://raw.githubusercontent.com/rushiaismywaifu/rushiaismywaifu.github.io/main/image.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rushia My Beloved">

  <link rel="icon" href="https://raw.githubusercontent.com/rushiaismywaifu/rushiaismywaifu.github.io/main/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <title>羽衣馬麻</title>
</head>
<body>
  <div class="background">
    <div class="content">

      <!-- ======== 自訂播放器 ======== -->
      <div class="player" id="player">
        <video id="video" preload="auto"
          src="https://github.com/rushiaismywaifu/ui_shigure/releases/download/1.0/ui_shigure.mkv">
        </video>

        <!-- 大播放按鈕 -->
        <div class="player__overlay" id="overlay">
          <button class="player__big-play" id="bigPlayBtn" aria-label="播放">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>

        <!-- 載入動畫 -->
        <div class="player__spinner" id="spinner">
          <div class="player__spinner-circle"></div>
        </div>

        <!-- 播放/暫停動畫氣泡 -->
        <div class="player__action" id="actionIcon"></div>

        <!-- 底部漸層 -->
        <div class="player__gradient"></div>

        <!-- 控制列 -->
        <div class="player__controls" id="controls">
          <!-- 進度條 -->
          <div class="player__progress" id="progressArea">
            <div class="player__progress-track">
              <div class="player__progress-buffer" id="bufferBar"></div>
              <div class="player__progress-filled" id="filledBar"></div>
            </div>
            <div class="player__progress-tooltip" id="tooltip">0:00</div>
          </div>

          <!-- 按鈕列 -->
          <div class="player__bar">
            <button class="player__btn" id="playBtn" aria-label="播放"></button>
            <span class="player__time" id="timeDisplay">0:00 / 0:00</span>

            <div class="player__spacer"></div>

            <!-- ★ 倍速選單 -->
            <div class="player__speed-wrapper" id="speedWrapper">
              <button class="player__btn player__speed-btn" id="speedBtn" aria-label="播放速度">1x</button>
              <div class="player__speed-menu" id="speedMenu">
                <div class="player__speed-title">播放速度</div>
                <button class="player__speed-option" data-speed="0.25">0.25x</button>
                <button class="player__speed-option" data-speed="0.5">0.5x</button>
                <button class="player__speed-option" data-speed="0.75">0.75x</button>
                <button class="player__speed-option active" data-speed="1">正常</button>
                <button class="player__speed-option" data-speed="1.25">1.25x</button>
                <button class="player__speed-option" data-speed="1.5">1.5x</button>
                <button class="player__speed-option" data-speed="1.75">1.75x</button>
                <button class="player__speed-option" data-speed="2">2x</button>
              </div>
            </div>

            <button class="player__btn" id="volBtn" aria-label="音量"></button>
            <div class="player__vol-wrap" id="volWrap">
              <div class="player__vol-track" id="volTrack">
                <div class="player__vol-filled" id="volFilled"></div>
              </div>
            </div>
            <button class="player__btn" id="pipBtn" aria-label="子母畫面"></button>
            <button class="player__btn" id="fsBtn" aria-label="全螢幕"></button>
          </div>
        </div>
      </div>
      <!-- ======== /播放器 ======== -->

      <!-- 更換影片 -->
      <div class="input-wrapper">
        <input type="url" id="videoURL" class="url-input"
          placeholder="輸入影片連結（.mp4 / .webm / .mkv）" aria-label="影片連結">
        <button id="changeVideoBtn" class="change-btn">▶ 更換影片</button>
      </div>
      <div id="errorMsg" class="error-msg" role="alert" hidden></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
